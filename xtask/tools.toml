[rustup_components]
required = ["rustfmt", "clippy"]

[cargo_bins.cargo-audit]
install = "cargo install cargo-audit --locked"

[cargo_bins.cargo-deny]
install = "cargo install cargo-deny --locked"

[cargo_bins.typos]
install = "cargo install typos-cli --version 1.49.0 --locked"

[checks]
format = "cargo fmt --all --check"
clippy = "cargo clippy --workspace --exclude tura_gui --all-targets"
audit = "cargo audit"
deny = "cargo deny check"
typos = "typos"
