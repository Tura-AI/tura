[package]
name = "tura_workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "3"
default-members = [
  ".",
  "commands/generate_media",
  "agents",
  "commands/read_media",
  "commands/web_discover",
  "crates/lifecycle",
  "crates/gateway",
  "crates/path",
  "crates/provider",
  "personas",
  "crates/router",
  "crates/router_contract",
  "crates/runtime",
  "crates/runtime_contract",
  "crates/session_log",
  "crates/session_log_contract",
  "crates/tools",
]
members = [
  ".",
  "agents",
  "apps/tauri/src-tauri",
  "commands/generate_media",
  "commands/read_media",
  "commands/web_discover",
  "crates/lifecycle",
  "crates/gateway",
  "crates/path",
  "crates/provider",
  "personas",
  "crates/router",
  "crates/router_contract",
  "crates/runtime",
  "crates/runtime_contract",
  "crates/session_log",
  "crates/session_log_contract",
  "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tura"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
  "charset",
  "http2",
  "system-proxy",
  "form",
  "json",
  "query",
  "stream",
  "rustls-no-provider",
] }
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "jpeg",
  "png",
  "webp",
] }
anyhow = "1.0.104"
arboard = "3.6.1"
async-trait = "0.1.91"
filetime = "0.2"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.33"
futures-util = "0.3.33"
lifecycle = { path = "crates/lifecycle" }
parking_lot = "0.12.5"
pdfium-render = { version = "0.9.3", features = ["image_025"] }
png = "0.18.1"
redis = { version = "1.4.1", features = ["tokio-comp"] }
regex = "1.13.1"
rustls = { version = "0.23.42", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
quick_html2md = "0.2.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
sysinfo = "0.39.6"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-single-instance = "2.4.3"
tao = { version = "0.35.3", default-features = false, features = [
  "x11",
  "dbus",
] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

agents = { path = "agents" }
provider = { path = "crates/provider" }
tura_path = { path = "crates/path" }
personas = { path = "personas" }
router = { path = "crates/router" }
router_contract = { path = "crates/router_contract" }
runtime = { path = "crates/runtime" }
runtime_contract = { path = "crates/runtime_contract" }
session_log = { path = "crates/session_log" }
session_log_contract = { path = "crates/session_log_contract" }
tools = { path = "crates/tools" }

tura-agents = { package = "agents", path = "agents" }
tura-llm-rust = { package = "provider", path = "crates/provider" }
tura-persona = { package = "personas", path = "personas" }
tura-router = { package = "router", path = "crates/router" }

[profile.test]
debug = 0
incremental = false

[dev-dependencies]
anyhow.workspace = true
chrono.workspace = true
lifecycle.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
session_log.workspace = true
session_log_contract.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
tokio.workspace = true
router.workspace = true
router_contract.workspace = true
runtime.workspace = true
tools.workspace = true
uuid.workspace = true

[features]
os-tests = []

[[test]]
name = "process_state_management_e2e"
path = "tests/os_testing/process_state_management_e2e.rs"
required-features = ["os-tests"]

[[test]]
name = "english_agent_output_punctuation"
path = "tests/english_agent_output_punctuation.rs"

[[test]]
name = "session_db_workspace_flow_e2e"
path = "tests/os_testing/session_db_workspace_flow_e2e.rs"
required-features = ["os-tests"]

[[test]]
name = "session_db_restart_queue_resilience"
path = "tests/os_testing/session_db_restart_queue_resilience.rs"
required-features = ["os-tests"]

[[test]]
name = "process_scope_management_e2e"
path = "tests/os_testing/process_scope_management_e2e.rs"
required-features = ["os-tests"]

[[test]]
name = "process_lifecycle_policy_matrix"
path = "tests/os_testing/process_lifecycle_policy_matrix.rs"
required-features = ["os-tests"]

[[test]]
name = "command_run_router_ownership_e2e"
path = "tests/os_testing/command_run_router_ownership_e2e.rs"
required-features = ["os-tests"]
