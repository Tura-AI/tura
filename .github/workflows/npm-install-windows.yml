name: NPM Install Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-install:
    name: npm install Windows (${{ matrix.install-mode }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        install-mode:
          - global
          - local

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - name: npm 12 setup
        shell: pwsh
        run: |
          $npm12Root = Join-Path $env:RUNNER_TEMP "npm12"
          npm install --prefix $npm12Root npm@12.0.2 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $npm12Root "node_modules\.bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Record environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test npm launcher environment
        run: node --test scripts/npm/launcher-env.test.mjs

      - name: Test simulated npm release install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/npm/verify-npm-install-fixture.mjs --install-mode=${{ matrix.install-mode }} 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "npm-install-${{ matrix.install-mode }}.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test published npm package and runtime resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/npm/install-and-verify-published.mjs --install-mode=${{ matrix.install-mode }} 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "npm-install-${{ matrix.install-mode }}.log") -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload npm install log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-install-windows-${{ matrix.install-mode }}-log
          path: ${{ runner.temp }}\npm-install-${{ matrix.install-mode }}.log
          if-no-files-found: warn
